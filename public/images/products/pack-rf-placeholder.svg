<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#FEFCF9"/>

  <!-- Gold ring glow background -->
  <circle cx="300" cy="260" r="180" fill="none" stroke="#C9A96E" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="300" cy="260" r="155" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.2"/>

  <!-- RF Device body -->
  <rect x="230" y="100" width="140" height="250" rx="28" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
  <rect x="232" y="102" width="136" height="246" rx="26" fill="url(#deviceGrad)"/>

  <!-- LED Screen -->
  <rect x="250" y="125" width="100" height="70" rx="10" fill="#1A1A2E"/>
  <rect x="253" y="128" width="94" height="64" rx="8" fill="#0D1B2A"/>
  <!-- Screen content -->
  <text x="300" y="153" text-anchor="middle" font-family="monospace" font-size="11" fill="#C9A96E" font-weight="bold">RF MODE</text>
  <text x="300" y="172" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffffff" font-weight="bold">42°C</text>

  <!-- Gold ring around device -->
  <circle cx="300" cy="245" r="88" fill="none" stroke="url(#goldRing)" stroke-width="8"/>
  <circle cx="300" cy="245" r="84" fill="none" stroke="#C9A96E" stroke-width="1" opacity="0.4"/>

  <!-- Power button -->
  <circle cx="300" cy="340" r="18" fill="#C9A96E"/>
  <circle cx="300" cy="340" r="14" fill="#B08D4F"/>
  <line x1="300" y1="330" x2="300" y2="336" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M292 333 Q300 324 308 333" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Cream tube -->
  <rect x="390" y="200" width="48" height="130" rx="8" fill="url(#creamGrad)"/>
  <rect x="390" y="200" width="48" height="20" rx="4" fill="#C9A96E"/>
  <rect x="406" y="184" width="16" height="20" rx="4" fill="#B08D4F"/>
  <rect x="410" y="170" width="8" height="18" rx="3" fill="#D4B483"/>
  <!-- Cream label -->
  <rect x="393" y="225" width="42" height="90" rx="3" fill="white" opacity="0.9"/>
  <text x="414" y="248" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#C9A96E" font-weight="bold">NUVIA</text>
  <text x="414" y="259" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#1A1A2E">RF CREAM</text>
  <text x="414" y="270" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#6B6B6B">COLLAGEN</text>
  <text x="414" y="280" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#6B6B6B">BOOST</text>

  <!-- RF waves emanating from device -->
  <path d="M218 220 Q195 245 218 270" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M207 210 Q178 245 207 280" fill="none" stroke="#C9A96E" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Stars / sparkles -->
  <text x="160" y="180" font-size="14" opacity="0.6" fill="#C9A96E">✦</text>
  <text x="430" y="170" font-size="10" opacity="0.5" fill="#C9A96E">✦</text>
  <text x="175" y="320" font-size="8" opacity="0.4" fill="#C9A96E">✦</text>

  <!-- Product name -->
  <text x="300" y="428" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1A1A2E" font-weight="bold">باقة RF لشد الجلد</text>
  <text x="300" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#C9A96E">Nuvia RF Skin Tightening Kit</text>

  <!-- Divider -->
  <line x1="200" y1="470" x2="400" y2="470" stroke="#E8D5B7" stroke-width="1"/>

  <!-- Badges -->
  <rect x="195" y="482" width="90" height="26" rx="13" fill="#C9A96E" opacity="0.15"/>
  <text x="240" y="499" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B08D4F" font-weight="bold">جهاز RF</text>
  <rect x="315" y="482" width="90" height="26" rx="13" fill="#C9A96E" opacity="0.15"/>
  <text x="360" y="499" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B08D4F" font-weight="bold">كريم الشد</text>

  <!-- Coming soon watermark -->
  <text x="300" y="550" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B0B0B0" opacity="0.7">الصورة الرسمية قريباً</text>

  <defs>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8D5B7"/>
      <stop offset="100%" stop-color="#B08D4F"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F8F8"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>
  </defs>
</svg>
