<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#FEFCF9"/>

  <!-- Outer glow rings -->
  <circle cx="300" cy="260" r="185" fill="none" stroke="#E74C3C" stroke-width="0.8" stroke-dasharray="5 5" opacity="0.2"/>
  <circle cx="300" cy="260" r="160" fill="none" stroke="#C9A96E" stroke-width="0.5" opacity="0.15"/>

  <!-- Device body — silver design -->
  <rect x="225" y="95" width="150" height="260" rx="30" fill="url(#silverGrad)" stroke="#D0D0D0" stroke-width="1.5"/>

  <!-- Top handle accent -->
  <rect x="270" y="95" width="60" height="12" rx="6" fill="#B0B0B0"/>

  <!-- LED ring — red (infrared) -->
  <circle cx="300" cy="225" r="72" fill="none" stroke="#E74C3C" stroke-width="6" opacity="0.8"/>
  <circle cx="300" cy="225" r="68" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.4"/>
  <!-- LED dots on ring -->
  <circle cx="300" cy="155" r="4" fill="#E74C3C" opacity="0.9"/>
  <circle cx="368" cy="191" r="4" fill="#E74C3C" opacity="0.9"/>
  <circle cx="368" cy="259" r="4" fill="#E74C3C" opacity="0.9"/>
  <circle cx="300" cy="295" r="4" fill="#E74C3C" opacity="0.9"/>
  <circle cx="232" cy="259" r="4" fill="#E74C3C" opacity="0.9"/>
  <circle cx="232" cy="191" r="4" fill="#E74C3C" opacity="0.9"/>

  <!-- Device face / emission head -->
  <circle cx="300" cy="225" r="55" fill="url(#headGrad)"/>
  <circle cx="300" cy="225" r="48" fill="#2A2A3E" opacity="0.9"/>
  <!-- Ultrasound symbol -->
  <path d="M278 215 Q300 200 322 215" fill="none" stroke="#C9A96E" stroke-width="2" stroke-linecap="round"/>
  <path d="M272 225 Q300 205 328 225" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M266 235 Q300 210 334 235" fill="none" stroke="#C9A96E" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <circle cx="300" cy="225" r="6" fill="#C9A96E"/>

  <!-- 3-in-1 badge on device -->
  <rect x="261" y="285" width="78" height="22" rx="11" fill="#1A1A2E"/>
  <text x="300" y="299" text-anchor="middle" font-family="monospace" font-size="9" fill="#C9A96E" font-weight="bold">3-IN-1</text>

  <!-- Mode buttons -->
  <rect x="255" y="318" width="28" height="16" rx="4" fill="#E74C3C" opacity="0.8"/>
  <text x="269" y="329" text-anchor="middle" font-family="monospace" font-size="6" fill="white" font-weight="bold">IR</text>
  <rect x="286" y="318" width="28" height="16" rx="4" fill="#3498DB" opacity="0.8"/>
  <text x="300" y="329" text-anchor="middle" font-family="monospace" font-size="6" fill="white" font-weight="bold">EMS</text>
  <rect x="317" y="318" width="28" height="16" rx="4" fill="#2ECC71" opacity="0.8"/>
  <text x="331" y="329" text-anchor="middle" font-family="monospace" font-size="5" fill="white" font-weight="bold">SONIC</text>

  <!-- Power button -->
  <circle cx="300" cy="355" r="12" fill="#C9A96E"/>
  <circle cx="300" cy="355" r="9" fill="#B08D4F"/>
  <line x1="300" y1="348" x2="300" y2="352" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M294 350 Q300 344 306 350" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Gel bottle -->
  <rect x="388" y="175" width="52" height="150" rx="10" fill="url(#gelGrad)"/>
  <rect x="388" y="175" width="52" height="25" rx="6" fill="#2A7FBF"/>
  <rect x="403" y="158" width="22" height="20" rx="4" fill="#1A6BA8"/>
  <rect x="408" y="143" width="12" height="18" rx="3" fill="#2A7FBF"/>
  <!-- Gel cap -->
  <rect x="406" y="138" width="16" height="10" rx="3" fill="#1A1A2E"/>
  <!-- Gel label -->
  <rect x="391" y="206" width="46" height="105" rx="3" fill="white" opacity="0.92"/>
  <text x="414" y="228" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#2A7FBF" font-weight="bold">NUVIA</text>
  <text x="414" y="240" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#1A1A2E">SONIC GEL</text>
  <line x1="397" y1="247" x2="431" y2="247" stroke="#E8D5B7" stroke-width="0.5"/>
  <text x="414" y="258" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#6B6B6B">TRANSOUND</text>
  <text x="414" y="268" text-anchor="middle" font-family="sans-serif" font-size="4.5" fill="#6B6B6B">ULTRA PRO</text>
  <text x="414" y="282" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#C9A96E">200ml</text>

  <!-- Ultrasound waves from device -->
  <path d="M220 205 Q200 225 220 245" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <path d="M210 195 Q183 225 210 255" fill="none" stroke="#E74C3C" stroke-width="1" stroke-dasharray="3 3" opacity="0.25"/>

  <!-- Sparkles -->
  <text x="158" y="185" font-size="12" opacity="0.5" fill="#E74C3C">✦</text>
  <text x="432" y="160" font-size="10" opacity="0.4" fill="#C9A96E">✦</text>
  <text x="170" y="330" font-size="8" opacity="0.35" fill="#C9A96E">✦</text>

  <!-- Product name -->
  <text x="300" y="428" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1A1A2E" font-weight="bold">باقة الموجات الفوقية الصوتية</text>
  <text x="300" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#C9A96E">Nuvia Ultrasonic 3-in-1 Kit</text>

  <!-- Divider -->
  <line x1="200" y1="470" x2="400" y2="470" stroke="#E8D5B7" stroke-width="1"/>

  <!-- Tech badges -->
  <rect x="175" y="480" width="62" height="24" rx="12" fill="#E74C3C" opacity="0.12"/>
  <text x="206" y="495" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#C0392B" font-weight="bold">IR</text>
  <rect x="247" y="480" width="62" height="24" rx="12" fill="#3498DB" opacity="0.12"/>
  <text x="278" y="495" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#2980B9" font-weight="bold">EMS</text>
  <rect x="319" y="480" width="62" height="24" rx="12" fill="#2ECC71" opacity="0.12"/>
  <text x="350" y="495" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#27AE60" font-weight="bold">Sonic</text>

  <!-- Coming soon watermark -->
  <text x="300" y="550" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B0B0B0" opacity="0.7">الصورة الرسمية قريباً</text>

  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="40%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A4E"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="gelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EEF7FF"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
  </defs>
</svg>
